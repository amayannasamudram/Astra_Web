<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astra — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="brand_assets/favicon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #FAFAF7;
      --ink: #0E0E0C;
      --ink-2: #2A2A26;
      --mute: #8A8A82;
      --hair: #E6E5DF;
      --accent: #2161ff;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter Tight', -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 72px;
    }
    .brand img { height: 32px; width: auto; mix-blend-mode: multiply; }

    .content {
      width: 100%;
      max-width: 480px;
      text-align: left;
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(40px, 8vw, 64px);
      font-weight: 400;
      letter-spacing: -0.035em;
      line-height: 1.02;
      margin-bottom: 20px;
    }

    .sub {
      font-size: 16px;
      color: var(--ink-2);
      line-height: 1.55;
      margin-bottom: 48px;
      max-width: 38ch;
    }

    .gate {
      border-top: 1px solid var(--hair);
      padding-top: 32px;
    }

    .gate-label {
      font-size: 12px;
      color: var(--mute);
      margin-bottom: 12px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .pw-input {
      flex: 1;
      height: 44px;
      padding: 0 16px;
      border: 1px solid var(--hair);
      border-radius: 8px;
      background: #fff;
      font-family: 'Inter Tight', sans-serif;
      font-size: 15px;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s;
    }
    .pw-input:focus { border-color: var(--accent); }
    .pw-input::placeholder { color: var(--mute); }

    .pw-btn {
      height: 44px;
      padding: 0 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Inter Tight', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .pw-btn:hover { opacity: 0.88; }

    .error {
      margin-top: 10px;
      font-size: 13px;
      color: #c0392b;
      display: none;
    }
    .error.visible { display: block; }

    footer-line {
      display: block;
      margin-top: 80px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--mute);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <div class="brand">
    <img src="brand_assets/favicon.png" alt="Astra" />
  </div>

  <div class="content">
    <h1>Something<br>new is<br>coming.</h1>
    <p class="sub">We're rebuilding the experience from the ground up. Check back soon — it'll be worth it.</p>

    <div class="gate">
      <div class="gate-label">Preview access</div>
      <div class="input-row">
        <input
          class="pw-input"
          id="pw"
          type="password"
          placeholder="Enter password"
          autocomplete="off"
          autofocus
        />
        <button class="pw-btn" id="go">Enter →</button>
      </div>
      <div class="error" id="err">Incorrect password. Try again.</div>
    </div>
  </div>

  <footer-line>© 2026 Astra Technologies Inc.</footer-line>

  <script>
    const PW = 'astra2026';
    const input = document.getElementById('pw');
    const btn = document.getElementById('go');
    const err = document.getElementById('err');

    function tryUnlock() {
      if (input.value === PW) {
        localStorage.setItem('astra_preview', '1');
        window.location.href = '/home.html';
      } else {
        err.classList.add('visible');
        input.value = '';
        input.focus();
      }
    }

    btn.addEventListener('click', tryUnlock);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
    input.addEventListener('input', () => err.classList.remove('visible'));
  </script>

</body>
</html>
